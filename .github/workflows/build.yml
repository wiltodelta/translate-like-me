name: Build Translate Like Me App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    # macOS 26 host: actool renders the Icon Composer icon with macOS 26 system
    # frameworks and crashed on the macos-15 image (Xcode 26.3, 2026-09-23).
    runs-on: macos-26
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    # The runner context is not available in job-level env, so the signing
    # keychain path is exported here for the import and cleanup steps.
    - name: Select latest Xcode
      run: |
        echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
        LATEST_XCODE=$(ls /Applications | grep "Xcode" | sort -V | tail -1)
        echo "Using: $LATEST_XCODE"
        sudo xcode-select -s /Applications/$LATEST_XCODE/Contents/Developer

    - name: Display build environment
      run: |
        xcodebuild -version
        swift --version

    - name: Clean build cache
      run: |
        rm -rf .build
        rm -rf ~/Library/Caches/org.swift.swiftpm
        rm -rf ~/Library/Developer/Xcode/DerivedData

    - name: Lint with SwiftLint
      run: |
        if ! command -v swiftlint >/dev/null 2>&1; then
          brew install swiftlint
        fi
        swiftlint lint

    - name: Run tests
      run: swift test

    # Tag builds only: a temporary keychain with the Developer ID Application
    # identity and the notarytool profile, so build.sh signs with it (hardened
    # runtime, timestamp) and notarize.sh notarizes and staples. Secrets are never
    # exposed to pull requests from forks; branch builds stay ad hoc.
    - name: Import signing identity and notary credentials (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: |
        KEYCHAIN="$SIGNING_KEYCHAIN"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
        security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
          -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
        curl -sSf -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
        security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
        xcrun notarytool store-credentials notary-K2GT9Q4S6U --keychain "$KEYCHAIN" \
          --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
        rm "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
        security find-identity -v -p codesigning "$KEYCHAIN"
        echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

    # build.sh stamps the version from the tag (git describe), so the checkout
    # needs the tags fetched above.
    - name: Build app bundle (Developer ID with timestamp on tag, ad hoc otherwise)
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export RELEASE=1; fi
        ./build.sh

    - name: Notarize and zip (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      run: ./notarize.sh

    - name: Zip unsigned build (not a tag)
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: ./notarize.sh --zip-only

    - name: Upload app bundle
      uses: actions/upload-artifact@v7
      with:
        name: TranslateLikeMe-macOS
        path: TranslateLikeMe-v*-macOS.zip
        retention-days: 30

    - name: Create release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: TranslateLikeMe-v*-macOS.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove signing keychain
      if: always() && startsWith(github.ref, 'refs/tags/v')
      run: security delete-keychain "$SIGNING_KEYCHAIN" || true
