name: Build Translate Like Me App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    # macOS 26 host: actool renders the Icon Composer icon with macOS 26 system
    # frameworks and crashed on the macos-15 image (Xcode 26.3, 2026-09-23).
    runs-on: macos-26
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true

    # The runner context is not available in job-level env, so the signing
    # keychain path is exported here for the import and cleanup steps.
    - name: Select latest Xcode
      run: |
        echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
        LATEST_XCODE=$(ls /Applications | grep "Xcode" | sort -V | tail -1)
        echo "Using: $LATEST_XCODE"
        sudo xcode-select -s /Applications/$LATEST_XCODE/Contents/Developer

    - name: Display build environment
      run: |
        xcodebuild -version
        swift --version

    - name: Clean build cache
      run: |
        rm -rf .build
        rm -rf ~/Library/Caches/org.swift.swiftpm
        rm -rf ~/Library/Developer/Xcode/DerivedData

    - name: Lint with SwiftLint
      run: |
        if ! command -v swiftlint >/dev/null 2>&1; then
          brew install swiftlint
        fi
        swiftlint lint --strict

    - name: Run tests
      run: swift test

    # Tag builds only: a temporary keychain with the Developer ID Application
    # identity and the notarytool profile, so build.sh signs with it (hardened
    # runtime, timestamp) and notarize.sh notarizes and staples. Secrets are never
    # exposed to pull requests from forks; branch builds stay ad hoc.
    - name: Import signing identity and notary credentials (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: |
        KEYCHAIN="$SIGNING_KEYCHAIN"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
        security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
          -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
        curl -sSf -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
        security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
        xcrun notarytool store-credentials notary-K2GT9Q4S6U --keychain "$KEYCHAIN" \
          --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
        rm "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
        security find-identity -v -p codesigning "$KEYCHAIN"
        echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

    # build.sh stamps the version from the tag (git describe), so the checkout
    # needs the tags fetched above.
    - name: Build app bundle (Developer ID with timestamp on tag, ad hoc otherwise)
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export RELEASE=1; fi
        ./build.sh

    - name: Notarize and zip (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        ./notarize.sh
        # Nothing after this needs the Developer ID; lock it before third-party
        # steps run.
        security lock-keychain "$SIGNING_KEYCHAIN"

    # The Sparkle feed installed apps read (SUFeedURL points at the latest
    # release's appcast.xml). It holds this release only, signed with the EdDSA
    # key, and embeds the release notes: the tag annotation's body, which is also
    # the GitHub release body, so the notes are written once, in `git tag -a`.
    - name: Generate the Sparkle appcast (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        FEED="$RUNNER_TEMP/appcast"
        mkdir -p "$FEED"
        ZIP=$(ls Translate-Like-Me-v*-macOS.zip)
        cp "$ZIP" "$FEED/"
        # Release notes are the annotated tag's body; refuse a lightweight tag or
        # an empty body rather than publish a release without notes.
        [[ $(git cat-file -t "$GITHUB_REF_NAME") == tag ]] ||
          { echo "::error::$GITHUB_REF_NAME must be an annotated tag (git tag -a)"; exit 1; }
        git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > release-notes.md
        grep -q '[^[:space:]]' release-notes.md ||
          { echo "::error::the $GITHUB_REF_NAME annotation has no body; it is the release notes"; exit 1; }
        cp release-notes.md "$FEED/${ZIP%.zip}.md"
        echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
          --ed-key-file - --embed-release-notes --maximum-deltas 0 \
          --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
          -o "$PWD/appcast.xml" "$FEED"
        grep -q 'sparkle:edSignature' appcast.xml
        cat appcast.xml

    - name: Zip unsigned build (not a tag)
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: ./notarize.sh --zip-only

    - name: Upload app bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: Translate-Like-Me-macOS
        path: Translate-Like-Me-v*-macOS.zip
        retention-days: 30

    - name: Create release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          Translate-Like-Me-v*-macOS.zip
          appcast.xml
        body_path: release-notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove signing keychain
      if: always() && startsWith(github.ref, 'refs/tags/v')
      run: security delete-keychain "$SIGNING_KEYCHAIN" || true
